<a [routerLink]="isEdit ? ['/vehicles', vehicleId] : ['/vehicles']">&larr; Back</a>

<h2>{{ isEdit ? 'Edit vehicle' : 'New vehicle' }}</h2>

<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid">
    <label>
      Name / call sign
      <input type="text" formControlName="name">
      <span class="invalid" *ngIf="invalid('name')">Required</span>
    </label>
    <label>
      Plate
      <input type="text" formControlName="plate">
      <span class="invalid" *ngIf="invalid('plate')">Required</span>
    </label>
    <label>
      Make
      <input type="text" formControlName="make">
    </label>
    <label>
      Model
      <input type="text" formControlName="model">
    </label>
    <label>
      Year
      <input type="number" formControlName="year">
      <span class="invalid" *ngIf="invalid('year')">1980–2100</span>
    </label>
    <label>
      Odometer (km)
      <input type="number" formControlName="odometerKm" min="0">
      <span class="invalid" *ngIf="invalid('odometerKm')">0 or more</span>
    </label>
    <label>
      Service every (km)
      <input type="number" formControlName="serviceIntervalKm" step="500">
      <span class="invalid" *ngIf="invalid('serviceIntervalKm')">1,000–100,000</span>
    </label>
    <label>
      Status
      <select formControlName="status">
        <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
      </select>
    </label>
  </div>

  <p class="error" *ngIf="error">{{ error }}</p>

  <div class="actions">
    <button type="submit" [disabled]="saving">{{ saving ? 'Saving…' : 'Save' }}</button>
  </div>
</form>
