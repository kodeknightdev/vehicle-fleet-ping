<h2>Vehicles</h2>

<p *ngIf="loading">Loading…</p>
<p class="error" *ngIf="error">{{ error }}</p>

<table *ngIf="!loading && vehicles.length">
  <thead>
    <tr>
      <th>Name</th>
      <th>Plate</th>
      <th>Make / model</th>
      <th>Year</th>
      <th class="num">Odometer (km)</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let v of vehicles">
      <td>{{ v.name }}</td>
      <td>{{ v.plate }}</td>
      <td>{{ v.make }} {{ v.model }}</td>
      <td>{{ v.year }}</td>
      <td class="num">{{ v.odometerKm | number }}</td>
      <td><span class="status" [ngClass]="'status-' + v.status">{{ v.status }}</span></td>
    </tr>
  </tbody>
</table>

<p *ngIf="!loading && !error && !vehicles.length">No vehicles yet.</p>
